# Claims manifest -- notes/orbital_ordering_report.tex + notes/presentation/
# RIKEN Research Presentation.pptx (slide text extracted via python-pptx).
# Built by reading both sources in full and extracting every numeric claim
# (not prose/narrative numbers like section references or equation labels).
#
# tolerance classes (as declared for this audit):
#   exact_energy_ha       -- deterministic sbd run, fixed inputs: 1e-9 Ha
#   exact_bit             -- bit-identical claims: EXACT, zero tolerance
#   correlation           -- Spearman/Pearson recomputed from same CSV: 1e-6
#   statistic             -- medians/percentiles/variance ratios: 1e-6
#   resampled_energy_mha  -- fixed seed+shots, SHIPPED reference: 1e-9 mHa
#   count                 -- counts and fractions: exact
#   rebuilt_reference      -- requires an independently rebuilt reference;
#                             NOT reproducible to the classes above by
#                             construction (see verification/TASK_A_FINDING4.md).
#                             Tolerance is the *observed spread* from Task A,
#                             not a numeric epsilon.
#
# tier: 0 = raw per-evaluation CSV stat: 1 = re-derived from cached
# reference/npz: 2 = re-sampling spot-check: 3 = cold-start / narrative,
# not independently re-verifiable by tiers 0-2.

